<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" role="img" aria-labelledby="title desc">
  <title id="title">Logo de apuração eleitoral</title>
  <desc id="desc">Emblema com gráfico de apuração e texto APURA.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d2432"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="chartGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f4d898"/>
      <stop offset="48%" stop-color="#f59d6d"/>
      <stop offset="100%" stop-color="#7ea7ff"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7ce0d1"/>
      <stop offset="100%" stop-color="#8b7dff"/>
    </linearGradient>
  </defs>

  <g transform="translate(10 15)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#bgGradient)"/>
    <rect x="14" y="14" width="72" height="72" rx="20" fill="#111827" opacity="0.9"/>
    <path d="M31 62 L46 46 L60 58 L79 31" fill="none" stroke="url(#lineGradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="79" cy="31" r="7" fill="#f4d898"/>
    <rect x="24" y="69" width="12" height="11" rx="4" fill="#f4d898"/>
    <rect x="42" y="62" width="12" height="18" rx="4" fill="#7ce0d1"/>
    <rect x="60" y="53" width="12" height="27" rx="4" fill="#8b7dff"/>
  </g>

  <g transform="translate(135 0)">
    <text x="0" y="57" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="2" fill="#f4f6f8">APURA</text>
    <text x="2" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="7" fill="#9ea7b5">ELEIÇÕES 2026</text>
    <rect x="2" y="100" width="208" height="4" rx="2" fill="url(#chartGradient)"/>
  </g>
</svg>
